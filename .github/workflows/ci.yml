name: CI

# This repo has never had an automated check. `master` is protected and requires a
# PR, but nothing verified the PR — so a change that broke `tsc` or the production
# build reached a deployable branch and was found by Vercel, or by a person.
#
# There is no test suite here. Per CLAUDE.md, `tsc --noEmit` and a real build are
# the verification available, so those are what this runs.

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The production build throws on a missing API URL or S3 origin, deliberately:
      # a deploy that forgot them would otherwise serve dev data to real users. The
      # dev values are used here because this is a build check and never ships — and
      # they are public anyway, being baked into the browser bundle and committed in
      # .env.example. Never put production values here; Vercel holds those.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://pk1wr06fr1.execute-api.af-south-1.amazonaws.com/dev
          NEXT_PUBLIC_S3_ORIGIN: https://housinghub-files-dev.s3.af-south-1.amazonaws.com
        run: npm run build

      # Not blocking, and honestly so: this repo currently reports ~476 errors and
      # ~7600 warnings, so gating on it would fail every pull request on day one and
      # the check would be switched off within a week. Reported instead, to make the
      # number visible and let it be driven down. Remove continue-on-error when it
      # reaches zero — that is the point at which this becomes a real gate.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint
